name: Build NoReelInsta

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Check Instagram IPA URL
        env:
          IPA_URL: ${{ secrets.IPA_URL }}
        run: |
          if [ -z "$IPA_URL" ]; then
            echo "Add a repository secret named IPA_URL first."
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24.3"

      - name: Install dependencies
        run: |
          brew install make ldid
          git clone --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"
          python -m pip install pyzule-rw
          go install github.com/asdfzxcvbn/ipapatch@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Download Instagram IPA
        env:
          IPA_URL: ${{ secrets.IPA_URL }}
        run: |
          mkdir -p packages
          curl --fail --location --silent --show-error \
            "$IPA_URL" -o packages/com.burbn.instagram.ipa
          unzip -tq packages/com.burbn.instagram.ipa

      - name: Use runner's installed iOS SDK
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("Makefile")
          p.write_text(
              p.read_text().replace(
                  "TARGET := iphone:clang:16.2",
                  "TARGET := iphone:clang:latest:15.0"
              )
          )
          PY

      - name: Build and patch
        run: |
          chmod +x build.sh
          ./build.sh sideload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: NoReelInsta
          path: packages/NoReelInsta-sideloaded.ipa
          if-no-files-found: error
          retention-days: 1
